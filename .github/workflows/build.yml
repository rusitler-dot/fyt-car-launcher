              private fun openAppSmart(packages: List<String>) {
                  for (pkg in packages) {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          startActivity(intent)
                          return
                      }
                  }
                  Toast.makeText(this, "Uygun uygulama bulunamadı", Toast.LENGTH_SHORT).show()
              }

              private suspend fun fetchWeatherAndPressure(lat: Double, lon: Double) {
                  withContext(Dispatchers.IO) {
                      try {
                          val urlStr = "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&current=temperature_2m,surface_pressure,weather_code,wind_speed_10m,wind_direction_10m&daily=sunrise,sunset&timezone=auto"
                          val conn = URL(urlStr).openConnection() as HttpURLConnection
                          conn.connectTimeout = 5000
                          conn.readTimeout = 5000
                          if (conn.responseCode == 200) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              
                              val current = json.getJSONObject("current")
                              val temp = current.getDouble("temperature_2m").roundToInt()
                              val pressure = current.getDouble("surface_pressure").roundToInt()
                              val code = current.getInt("weather_code")
                              val windSpeed = current.getDouble("wind_speed_10m").roundToInt()
                              val windDirDeg = current.getDouble("wind_direction_10m")

                              val daily = json.getJSONObject("daily")
                              val sunrises = daily.getJSONArray("sunrise")
                              val sunsets = daily.getJSONArray("sunset")
                              
                              var sunriseStr = "--:--"
                              var sunsetStr = "--:--"
                              if (sunrises.length() > 0) {
                                  val rawSun = sunrises.getString(0)
                                  if (rawSun.length >= 16) sunriseStr = rawSun.substring(11, 16)
                              }
                              if (sunsets.length() > 0) {
                                  val rawSet = sunsets.getString(0)
                                  if (rawSet.length >= 16) sunsetStr = rawSet.substring(11, 16)
                              }

                              withContext(Dispatchers.Main) {
                                  temperatureText = "${temp}°C"
                                  weatherDesc = weatherCodeToTurkish(code)
                                  if (!hasHardwareBarometer) {
                                      pressureHpa = "$pressure hPa"
                                  }
                                  sunriseText = sunriseStr
                                  sunsetText = sunsetStr
                                  windSpeedText = "$windSpeed km/h"
                                  windDirText = degToCompass(windDirDeg)
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun updateAddress(lat: Double, lon: Double) {
                  try {
                      val geocoder = Geocoder(this, Locale.getDefault())
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          geocoder.getFromLocation(lat, lon, 1) { addresses ->
                              if (addresses.isNotEmpty()) {
                                  val addr = addresses[0]
                                  streetName = addr.thoroughfare ?: addr.featureName ?: "Bilinmeyen Sokak"
                                  cityName = addr.locality ?: addr.adminArea ?: "Bilinmeyen Şehir"
                              }
                          }
                      } else {
                          @Suppress("DEPRECATION")
                          val addresses = geocoder.getFromLocation(lat, lon, 1)
                          if (!addresses.isNullOrEmpty()) {
                              val addr = addresses[0]
                              streetName = addr.thoroughfare ?: addr.featureName ?: "Bilinmeyen Sokak"
                              cityName = addr.locality ?: addr.adminArea ?: "Bilinmeyen Şehir"
                          }
                      }
                  } catch (_: Exception) {}
              }

              private fun degToCompass(deg: Double): String {
                  val dirs = arrayOf("K", "KD", "D", "GD", "G", "GB", "B", "KB")
                  val idx = (((deg + 22.5) % 360) / 45.0).toInt() % 8
                  return dirs[idx]
              }

              private fun weatherCodeToTurkish(code: Int): String {
                  return when (code) {
                      0 -> "Açık"
                      1, 2, 3 -> "Parçalı Bulutlu"
                      45, 48 -> "Sisli"
                      51, 53, 55, 56, 57 -> "Çisenti"
                      61, 63, 65, 66, 67, 80, 81, 82 -> "Yağmurlu"
                      71, 73, 75, 77, 85, 86 -> "Karlı"
                      95, 96, 99 -> "Fırtına"
                      else -> "Bulutlu"
                  }
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event?.sensor?.type == Sensor.TYPE_PRESSURE) {
                      val hpa = event.values[0].roundToInt()
                      pressureHpa = "$hpa hPa"
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              override fun onResume() {
                  super.onResume()
                  hideSystemUI()
                  hasNotificationPermission = isNotificationServiceEnabled()
                  if (hasNotificationPermission) {
                      refreshActiveMedia()
                  }
              }

              private fun launchWazePiP() {
                  try {
                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("waze://")).apply {
                          setPackage("com.waze")
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(intent)
                      window.decorView.postDelayed({
                          val homeIntent = Intent(this, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                          }
                          startActivity(homeIntent)
                      }, 2500L)
                  } catch (_: Exception) {
                      openApp("com.waze")
                  }
              }

              private fun openBlitzerApp() {
                  val candidates = listOf("de.blitzer.plus", "de.blitzer", "Zz.blitzer.plus")
                  for (pkg in candidates) {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          startActivity(intent)
                          return
                      }
                  }
                  Toast.makeText(this, "Blitzer.de yüklü değil", Toast.LENGTH_SHORT).show()
              }

              private fun isNotificationServiceEnabled(): Boolean {
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  return flat != null && flat.contains(packageName)
              }

              private fun refreshActiveMedia() {
                  try {
                      val msm = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val component = ComponentName(this, MediaNotificationListener::class.java)
                      val controllers = msm.getActiveSessions(component)
                      if (controllers.isNotEmpty()) {
                          val controller = controllers.firstOrNull {
                              it.playbackState?.state == PlaybackState.STATE_PLAYING
                          } ?: controllers.first()
                          val meta = controller.metadata
                          if (meta != null) {
                              val title = meta.getString(MediaMetadata.METADATA_KEY_TITLE)
                                  ?: meta.getString(MediaMetadata.METADATA_KEY_DISPLAY_TITLE)
                              val artist = meta.getString(MediaMetadata.METADATA_KEY_ARTIST)
                                  ?: meta.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST)
                                  ?: meta.getString(MediaMetadata.METADATA_KEY_AUTHOR)
                              val art = meta.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                                  ?: meta.getBitmap(MediaMetadata.METADATA_KEY_ART)
                              if (!title.isNullOrBlank()) {
                                  MediaState.title = title
                                  MediaState.artist = if (!artist.isNullOrBlank()) artist else "YouTube Music"
                                  MediaState.albumArt = art
                              }
                          }
                          MediaState.isPlaying = controller.playbackState?.state == PlaybackState.STATE_PLAYING
                      }
                  } catch (_: Exception) {}
              }

              private fun sendMediaKey(keyCode: Int) {
                  val eventTime = SystemClock.uptimeMillis()
                  val downEvent = KeyEvent(eventTime, eventTime, KeyEvent.ACTION_DOWN, keyCode, 0)
                  val upEvent = KeyEvent(eventTime, eventTime, KeyEvent.ACTION_UP, keyCode, 0)
                  audioManager.dispatchMediaKeyEvent(downEvent)
                  audioManager.dispatchMediaKeyEvent(upEvent)
              }

              private fun getScreenBrightness(): Float {
                  return try {
                      Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS).toFloat()
                  } catch (_: Exception) {
                      128f
                  }
              }

              private fun setScreenBrightness(value: Float) {
                  if (Settings.System.canWrite(this)) {
                      Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, value.toInt())
                  } else {
                      val intent = Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS).apply {
                          data = Uri.parse("package:$packageName")
                      }
                      startActivity(intent)
                  }
              }

              private fun drawableToBitmap(drawable: Drawable): Bitmap? {
                  return try {
                      if (drawable is BitmapDrawable && drawable.bitmap != null) {
                          return drawable.bitmap
                      }
                      val width = if (drawable.intrinsicWidth > 0) drawable.intrinsicWidth else 96
                      val height = if (drawable.intrinsicHeight > 0) drawable.intrinsicHeight else 96
                      val bitmap = Bitmap.createBitmap(width, height, Bitmap.Config.ARGB_8888)
                      val canvas = Canvas(bitmap)
                      drawable.setBounds(0, 0, canvas.width, canvas.height)
                      drawable.draw(canvas)
                      bitmap
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun getInstalledApps(): List<AppInfo> {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  return pm.queryIntentActivities(intent, 0).map {
                      AppInfo(
                          label = it.loadLabel(pm).toString(),
                          packageName = it.activityInfo.packageName,
                          icon = drawableToBitmap(it.loadIcon(pm))
                      )
                  }.distinctBy { it.packageName }.sortedBy { it.label.lowercase() }
              }

              private fun startLocationUpdates() {
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500L, 0.5f, this)
                      locationManager.registerGnssStatusCallback(gnssCallback, Handler(Looper.getMainLooper()))
                      val lastKnown = locationManager.getLastKnownLocation(LocationManager.GPS_PROVIDER)
                          ?: locationManager.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                      if (lastKnown != null) {
                          onLocationChanged(lastKnown)
                      }
                  } catch (_: SecurityException) {}
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startLocationUpdates()
                  }
              }

              override fun onLocationChanged(location: Location) {
                  gpsActive = true
                  val kmh = (location.speed * 3.6f).toInt()
                  currentSpeedInt = kmh
                  if (kmh > maxSpeedInt) {
                      maxSpeedInt = kmh
                  }
                  if (location.hasAltitude()) {
                      altitudeMeters = location.altitude.roundToInt()
                  }
                  if (location.hasBearing()) {
                      bearingDeg = location.bearing
                      val deg = location.bearing.roundToInt()
                      bearingText = "$deg°"
                  }
                  if (location.hasAccuracy()) {
                      gpsAccuracy = location.accuracy.roundToInt()
                  }
                  lastLat = location.latitude
                  lastLon = location.longitude
                  gpsCoordinates = String.format(Locale.US, "%.4f° K, %.4f° D", location.latitude, location.longitude)
                  updateAddress(location.latitude, location.longitude)
              }

              private fun openApp(packageName: String) {
                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)
                  if (launchIntent != null) {
                      startActivity(launchIntent)
                  } else {
                      Toast.makeText(this, "Uygulama bulunamadı: $packageName", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try {
                      locationManager.unregisterGnssStatusCallback(gnssCallback)
                      sensorManager.unregisterListener(this)
                  } catch (_: Exception) {}
              }
          }
          EOF

      - name: 4. Gradle 8.5 Indir ve APK Derle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

