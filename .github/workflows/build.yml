          package com.fyt.carlauncher
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      Surface(
                          modifier = Modifier.fillMaxSize(),
                          color = Color(0xFF121212)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxSize().padding(8.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              // 1. Bölge: Sol Dock / Menü
                              Card(
                                  modifier = Modifier.weight(1.2f).fillMaxHeight(),
                                  shape = RoundedCornerShape(12.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                              ) {
                                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                      Text("Dock", color = Color.White, fontSize = 14.sp)
                                  }
                              }

                              // Orta Alan Kartları (2 ila 7. Bölgeler)
                              Column(
                                  modifier = Modifier.weight(8.8f).fillMaxHeight(),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  // Üst Satır
                                  Row(
                                      modifier = Modifier.weight(6.5f).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 2. Bölge: Harita (Maps)
                                      Card(
                                         modifier = Modifier.weight(4.2f).fillMaxHeight(),
                                         shape = RoundedCornerShape(12.dp),
                                         colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Text("Google Maps / Navigasyon", color = Color.LightGray, fontSize = 16.sp)
                                          }
                                      }

                                      // 3. Bölge: AUX Kamera + GLSL
                                      Card(
                                          modifier = Modifier.weight(3.2f).fillMaxHeight(),
                                          shape = RoundedCornerShape(12.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Text("AUX Kamera (GLSL)", color = Color.LightGray, fontSize = 14.sp)
                                          }
                                      }

                                      // Sağ Kolon (Hız ve Blitzer)
                                      Column(
                                          modifier = Modifier.weight(2.6f).fillMaxHeight(),
                                          verticalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          // 4. Bölge: GPS Hız ve Limit
                                          Card(
                                              modifier = Modifier.weight(1f).fillMaxWidth(),
                                              shape = RoundedCornerShape(12.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                                          ) {
                                              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                                  Text("0 km/h", color = Color.Cyan, fontSize = 18.sp)
                                              }
                                          }
                                          // 5. Bölge: Blitzer.de
                                          Card(
                                              modifier = Modifier.weight(1f).fillMaxWidth(),
                                              shape = RoundedCornerShape(12.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                                          ) {
                                              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                                  Text("Blitzer.de", color = Color.Yellow, fontSize = 14.sp)
                                              }
                                          }
                                      }
                                  }

                                  // Alt Satır
                                  Row(
                                      modifier = Modifier.weight(3.5f).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 6. Bölge: YouTube Music
                                      Card(
                                          modifier = Modifier.weight(7f).fillMaxHeight(),
                                          shape = RoundedCornerShape(12.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Text("YouTube Music - Çalıyor...", color = Color.LightGray, fontSize = 14.sp)
