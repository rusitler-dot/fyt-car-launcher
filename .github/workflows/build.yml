name: Build FYT Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Proje Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/fyt/carlauncher app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FYTCarLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.fyt.carlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fyt.carlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:allowBackup="true"
                  android:label="FYT Car Launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MainActivity.kt
          package com.fyt.carlauncher

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.core.app.ActivityCompat
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity(), LocationListener {
              private lateinit var locationManager: LocationManager
              var currentSpeed by mutableStateOf("0")
              var trackTitle by mutableStateOf("YouTube Music - Bekleniyor...")

              private val mediaReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val artist = intent?.getStringExtra("artist") ?: ""
                      val track = intent?.getStringExtra("track") ?: ""
                      if (track.isNotEmpty()) {
                          trackTitle = if (artist.isNotEmpty()) "$artist - $track" else track
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemUI()

                  locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 100)
                  } else {
                      startLocationUpdates()
                  }

                  val filter = IntentFilter().apply {
                      addAction("com.android.music.metachanged")
                      addAction("com.google.android.apps.youtube.music.METADATA_CHANGED")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(mediaReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(mediaReceiver, filter)
                  }

                  setContent {
                      Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0D0D0D)) {
                          Row(
                              modifier = Modifier.fillMaxSize().padding(8.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              // 1. DOCK (Sol Menü - %10)
                              Card(
                                  modifier = Modifier.weight(1.0f).fillMaxHeight(),
                                  shape = RoundedCornerShape(14.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                              ) {
                                  Column(
                                      modifier = Modifier.fillMaxSize().padding(vertical = 16.dp),
                                      verticalArrangement = Arrangement.SpaceBetween,
                                      horizontalAlignment = Alignment.CenterHorizontally
                                  ) {
                                      Text("UYG.", color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.Bold,
                                          modifier = Modifier.clickable { openApp("com.android.vending") })
                                      Text("NAVI", color = Color(0xFF4CAF50), fontSize = 14.sp, fontWeight = FontWeight.Bold,
                                          modifier = Modifier.clickable { openApp("com.google.android.apps.maps") })
                                      Text("MÜZİK", color = Color(0xFFFF5252), fontSize = 14.sp, fontWeight = FontWeight.Bold,
                                          modifier = Modifier.clickable { openApp("com.google.android.apps.youtube.music") })
                                      Text("AYAR", color = Color.LightGray, fontSize = 14.sp, fontWeight = FontWeight.Bold,
                                          modifier = Modifier.clickable { startActivity(Intent(Settings.ACTION_SETTINGS)) })
                                  }
                              }

                              // SAĞ ANA BÖLGE (%90)
                              Column(
                                  modifier = Modifier.weight(9.0f).fillMaxHeight(),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  // ÜST SATIR (%75 Yükseklik)
                                  Row(
                                      modifier = Modifier.weight(7.5f).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 2. Google Maps (5.0 Oran)
                                      Card(
                                          modifier = Modifier.weight(5.0f).fillMaxHeight().clickable {
                                              openApp("com.google.android.apps.maps")
                                          },
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Text("Google Maps", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.SemiBold)
                                          }
                                      }

                                      // 3. AUX Kamera (2.4 Oran)
                                      Card(
                                          modifier = Modifier.weight(2.4f).fillMaxHeight().clickable {
                                              openApp("com.syu.av")
                                          },
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Text("AUX Kamera", color = Color(0xFF81D4FA), fontSize = 16.sp, fontWeight = FontWeight.Medium)
                                          }
                                      }

                                      // 4 & 5. Hız ve Blitzer.de (2.1 Oran)
                                      Column(
                                          modifier = Modifier.weight(2.1f).fillMaxHeight(),
                                          verticalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          Card(
                                              modifier = Modifier.weight(1f).fillMaxWidth(),
                                              shape = RoundedCornerShape(14.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                                          ) {
                                              Column(
                                                  modifier = Modifier.fillMaxSize(),
                                                  verticalArrangement = Arrangement.Center,
                                                  horizontalAlignment = Alignment.CenterHorizontally
                                              ) {
                                                  Text(currentSpeed, color = Color(0xFF00E5FF), fontSize = 36.sp, fontWeight = FontWeight.Bold)
                                                  Text("km/h", color = Color.Gray, fontSize = 12.sp)
                                              }
                                          }

                                          Card(
                                              modifier = Modifier.weight(1f).fillMaxWidth().clickable {
                                                  openApp("de.blitzer.plus")
                                              },
                                              shape = RoundedCornerShape(14.dp),
                                              colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                                          ) {
                                              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                                  Text("Blitzer.de", color = Color(0xFFFFD54F), fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                              }
                                          }
                                      }
                                  }

                                  // ALT SATIR (%25 Yükseklik)
                                  Row(
                                      modifier = Modifier.weight(2.5f).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 6. YouTube Music (6.9 Oran)
                                      Card(
                                          modifier = Modifier.weight(6.9f).fillMaxHeight().clickable {
                                              openApp("com.google.android.apps.youtube.music")
                                          },
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp), contentAlignment = Alignment.CenterStart) {
                                              Text(trackTitle, color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Medium)
                                          }
                                      }

                                      // 7. Tema / Parlaklık (3.1 Oran)
                                      Card(
                                          modifier = Modifier.weight(3.1f).fillMaxHeight().clickable {
                                              startActivity(Intent(Settings.ACTION_DISPLAY_SETTINGS))
                                          },
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1A1A))
                                      ) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Text("Parlaklık / Ekran", color = Color.LightGray, fontSize = 15.sp)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private fun startLocationUpdates() {
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500L, 0.5f, this)
                  } catch (_: SecurityException) {}
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startLocationUpdates()
                  }
              }

              override fun onLocationChanged(location: Location) {
                  currentSpeed = ((location.speed * 3.6f).toInt()).toString()
              }

              private fun openApp(packageName: String) {
                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)
                  if (launchIntent != null) {
                      startActivity(launchIntent)
                  }
              }

              private fun hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(mediaReceiver) } catch (_: Exception) {}
              }
          }
          EOF

      - name: 4. Gradle 8.5 Indir ve APK Derle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

      - name: 5. Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: FYT-1600x720-Car-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
