name: Build FYT Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Proje Klasorlerini ve Gradle Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/fyt/carlauncher app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FYTCarLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.fyt.carlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fyt.carlauncher"
                  minSdk = 28
                  targetSdk = 29
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.google.android.gms:play-services-location:21.1.0")
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MainActivity.kt
          package com.fyt.carlauncher
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      Surface(
                          modifier = Modifier.fillMaxSize(),
                          color = Color.Black
                      ) {
                          // 7-Zone FYT Car Launcher Grid Layout (1600x720)
                          Row(modifier = Modifier.fillMaxSize()) {
                              // Sol Dock / Menü Alanı
                              Box(
                                  modifier = Modifier
                                      .weight(1.5f)
                                      .fillMaxHeight()
                                      .background(Color.DarkGray),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text("Dock / Menü", color = Color.White, fontSize = 16.sp)
                              }

                              // Orta Alan (Modüller)
                              Column(
                                  modifier = Modifier
                                      .weight(8.5f)
                                      .fillMaxHeight()
                                  ,
                                  verticalArrangement = Arrangement.SpaceBetween
                              ) {
                                  // Üst Satır (Harita, AUX Kamera, Hız Göstergesi)
                                  Row(
                                      modifier = Modifier
                                          .weight(6f)
                                          .fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .weight(4f)
                                              .fillMaxHeight()
                                              .padding(4px)
                                              .background(Color.Gray),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text("Harita (Maps)", color = Color.White, fontSize = 18.sp)
                                      }

                                      Box(
                                          modifier = Modifier
                                              .weight(3f)
                                              .fillMaxHeight()
                                              .padding(4px)
                                              .background(Color.DarkGray),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text("AUX Kamera / GLSL", color = Color.White, fontSize = 16.sp)
                                      }

                                      Column(
                                          modifier = Modifier
                                              .weight(3f)
                                              .fillMaxHeight()
                                              .padding(4px),
                                          verticalArrangement = Arrangement.SpaceBetween
                                      ) {
                                          Box(
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .fillMaxWidth()
                                                  .background(Color.Gray),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Text("GPS Hız / Limit", color = Color.White, fontSize = 14.sp)
                                          }
                                          Box(
                                              modifier = Modifier
                                                  .weight(1f)
                                                  .fillMaxWidth()
                                                  .background(Color.DarkGray),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Text("Blitzer.de", color = Color.White, fontSize = 14.sp)
                                          }
                                      }
                                  }

                                  // Alt Satır (Müzik ve Tema/Parlaklık)
                                  Row(
                                      modifier = Modifier
                                          .weight(4f)
                                          .fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .weight(7f)
                                              .fillMaxHeight()
                                              .padding(4px)
                                              .background(Color.Gray),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text("YouTube Music Player", color = Color.White, fontSize = 16.sp)
                                      }

                                      Box(
                                          modifier = Modifier
                                              .weight(3f)
                                              .fillMaxHeight()
                                              .padding(4px)
                                              .background(Color.DarkGray),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text("Tema / Parlaklık", color = Color.White, fontSize = 14.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MainActivity.kt
          package com.fyt.carlauncher
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.Text
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      Box(modifier = Modifier.fillMaxSize().background(Color.Black), contentAlignment = Alignment.Center) {
                          Text(text = "FYT Car Launcher (1600x720)", color = Color.White, fontSize = 24.sp)
                      }
                  }
              }
          }
          EOF

      - name: 4. Gradle 8.5 İndir ve APK Derle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon

      - name: 5. Hazır APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: FYT-1600x720-Car-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
