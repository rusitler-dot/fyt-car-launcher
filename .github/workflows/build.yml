name: Build FYT Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Android SDK ve Lisanslari Kur
        uses: android-actions/setup-android@v3

      - name: 4. SDK Paketlerini Onayla
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-29" "platforms;android-34" "build-tools;34.0.0"

      - name: 5. Python Scriptini Calistir ve Klasoru Hazirla
        run: |
          python3 FYT_1600x720_CarLauncher_Kurulum.py
          if [ -d "FYTCarLauncher" ]; then
            cp -r FYTCarLauncher/* .
          fi
          ls -la

      - name: 6. Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 7. Debug APK Derle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 8. Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: FYT-1600x720-Car-Launcher-APK
          path: "**/build/outputs/apk/debug/*.apk"
