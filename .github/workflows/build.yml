name: Build FYT Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Proje Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/fyt/carlauncher app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FYTCarLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.fyt.carlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fyt.carlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="FYT Car Launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MainActivity.kt
          package com.fyt.carlauncher

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.KeyEvent
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.core.app.ActivityCompat
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import kotlinx.coroutines.delay
          import java.text.SimpleDateFormat
          import java.util.*

          data class AppInfo(val label: String, val packageName: String)

          class MainActivity : ComponentActivity(), LocationListener {
              private lateinit var locationManager: LocationManager
              private lateinit var audioManager: AudioManager

              var currentSpeed by mutableStateOf("0")
              var trackTitle by mutableStateOf("YouTube Music")
              var trackArtist by mutableStateOf("Medya Bekleniyor...")
              var isPlaying by mutableStateOf(false)

              private val mediaReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val artist = intent?.getStringExtra("artist") ?: ""
                      val track = intent?.getStringExtra("track") ?: ""
                      if (intent?.hasExtra("playing") == true) {
                          isPlaying = intent.getBooleanExtra("playing", false)
                      }
                      if (track.isNotEmpty()) {
                          trackTitle = track
                          trackArtist = if (artist.isNotEmpty()) artist else "Bilinmeyen Sanatçı"
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemUI()

                  locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.ACCESS_FINE_LOCATION), 100)
                  } else {
                      startLocationUpdates()
                  }

                  val filter = IntentFilter().apply {
                      addAction("com.android.music.metachanged")
                      addAction("com.android.music.playstatechanged")
                      addAction("com.google.android.apps.youtube.music.METADATA_CHANGED")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(mediaReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(mediaReceiver, filter)
                  }

                  setContent {
                      var isDarkTheme by remember { mutableStateOf(true) }
                      var showAppDrawer by remember { mutableStateOf(false) }
                      var brightness by remember { mutableStateOf(getScreenBrightness()) }
                      var currentTime by remember { mutableStateOf("00:00") }

                      LaunchedEffect(Unit) {
                          val sdf = SimpleDateFormat("HH:mm", Locale.getDefault())
                          while (true) {
                              currentTime = sdf.format(Date())
                              delay(10000L)
                          }
                      }

                      val bgColor = if (isDarkTheme) Color(0xFF0D0D0D) else Color(0xFFE0E0E0)
                      val cardColor = if (isDarkTheme) Color(0xFF1A1A1A) else Color(0xFFFFFFFF)
                      val textColor = if (isDarkTheme) Color.White else Color(0xFF121212)

                      Surface(modifier = Modifier.fillMaxSize(), color = bgColor) {
                          Row(
                              modifier = Modifier.fillMaxSize().padding(8.dp),
                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              // 1. DOCK (Sol Menü - %10)
                              Card(
                                  modifier = Modifier.weight(1.0f).fillMaxHeight(),
                                  shape = RoundedCornerShape(14.dp),
                                  colors = CardDefaults.cardColors(containerColor = cardColor)
                              ) {
                                  Column(
                                      modifier = Modifier.fillMaxSize().padding(vertical = 14.dp),
                                      verticalArrangement = Arrangement.SpaceBetween,
                                      horizontalAlignment = Alignment.CenterHorizontally
                                  ) {
                                      Text(currentTime, color = textColor, fontSize = 18.sp, fontWeight = FontWeight.Bold)

                                      IconButton(onClick = { showAppDrawer = true }, modifier = Modifier.size(48.dp)) {
                                          Icon(Icons.Default.Apps, contentDescription = "Uygulamalar", tint = textColor, modifier = Modifier.size(32.dp))
                                      }
                                      IconButton(onClick = { openApp("com.google.android.apps.maps") }, modifier = Modifier.size(48.dp)) {
                                          Icon(Icons.Default.Navigation, contentDescription = "Navigasyon", tint = Color(0xFF4CAF50), modifier = Modifier.size(32.dp))
                                      }
                                      IconButton(onClick = { openApp("com.google.android.apps.youtube.music") }, modifier = Modifier.size(48.dp)) {
                                          Icon(Icons.Default.LibraryMusic, contentDescription = "Müzik", tint = Color(0xFFFF5252), modifier = Modifier.size(32.dp))
                                      }
                                      IconButton(onClick = { startActivity(Intent(Settings.ACTION_SETTINGS)) }, modifier = Modifier.size(48.dp)) {
                                          Icon(Icons.Default.Settings, contentDescription = "Ayarlar", tint = Color.Gray, modifier = Modifier.size(32.dp))
                                      }
                                  }
                              }

                              // SAĞ ANA BÖLGE (%90)
                              Column(
                                  modifier = Modifier.weight(9.0f).fillMaxHeight(),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  // ÜST SATIR (%75 Yükseklik)
                                  Row(
                                      modifier = Modifier.weight(7.5f).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 2. Google Maps (5.0 Oran)
                                      Card(
                                          modifier = Modifier.weight(5.0f).fillMaxHeight().clickable {
                                              openApp("com.google.android.apps.maps")
                                          },
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = cardColor)
                                      ) {
                                          Column(
                                              modifier = Modifier.fillMaxSize(),
                                              verticalArrangement = Arrangement.Center,
                                              horizontalAlignment = Alignment.CenterHorizontally
                                          ) {
                                              Icon(Icons.Default.Map, contentDescription = null, tint = Color(0xFF4CAF50), modifier = Modifier.size(56.dp))
                                              Spacer(modifier = Modifier.height(8.dp))
                                              Text("Google Maps", color = textColor, fontSize = 22.sp, fontWeight = FontWeight.SemiBold)
                                              Text("Navigasyonu Başlat", color = Color.Gray, fontSize = 13.sp)
                                          }
                                      }

                                      // 3. AUX Kamera (2.4 Oran)
                                      Card(
                                          modifier = Modifier.weight(2.4f).fillMaxHeight().clickable {
                                              openApp("com.syu.av")
                                          },
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = cardColor)
                                      ) {
                                          Column(
                                              modifier = Modifier.fillMaxSize(),
                                              verticalArrangement = Arrangement.Center,
                                              horizontalAlignment = Alignment.CenterHorizontally
                                          ) {
                                              Icon(Icons.Default.Videocam, contentDescription = null, tint = Color(0xFF29B6F6), modifier = Modifier.size(48.dp))
                                              Spacer(modifier = Modifier.height(8.dp))
                                              Text("AUX Kamera", color = textColor, fontSize = 18.sp, fontWeight = FontWeight.Medium)
                                          }
                                      }

                                      // 4 & 5. Hız ve Blitzer.de (2.1 Oran)
                                      Column(
                                          modifier = Modifier.weight(2.1f).fillMaxHeight(),
                                          verticalArrangement = Arrangement.spacedBy(8.dp)
                                      ) {
                                          Card(
                                              modifier = Modifier.weight(1f).fillMaxWidth(),
                                              shape = RoundedCornerShape(14.dp),
                                              colors = CardDefaults.cardColors(containerColor = cardColor)
                                          ) {
                                              Column(
                                                  modifier = Modifier.fillMaxSize(),
                                                  verticalArrangement = Arrangement.Center,
                                                  horizontalAlignment = Alignment.CenterHorizontally
                                              ) {
                                                  Text(currentSpeed, color = Color(0xFF00E5FF), fontSize = 44.sp, fontWeight = FontWeight.Bold)
                                                  Text("km/h", color = Color.Gray, fontSize = 13.sp)
                                              }
                                          }

                                          Card(
                                              modifier = Modifier.weight(1f).fillMaxWidth().clickable {
                                                  openApp("de.blitzer.plus")
                                              },
                                              shape = RoundedCornerShape(14.dp),
                                              colors = CardDefaults.cardColors(containerColor = cardColor)
                                          ) {
                                              Column(
                                                  modifier = Modifier.fillMaxSize(),
                                                  verticalArrangement = Arrangement.Center,
                                                  horizontalAlignment = Alignment.CenterHorizontally
                                              ) {
                                                  Icon(Icons.Default.Warning, contentDescription = null, tint = Color(0xFFFFCA28), modifier = Modifier.size(32.dp))
                                                  Spacer(modifier = Modifier.height(4.dp))
                                                  Text("Blitzer.de", color = textColor, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                              }
                                          }
                                      }
                                  }

                                  // ALT SATIR (%25 Yükseklik)
                                  Row(
                                      modifier = Modifier.weight(2.5f).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      // 6. YouTube Music & Medya Kontrolleri (6.9 Oran)
                                      Card(
                                          modifier = Modifier.weight(6.9f).fillMaxHeight(),
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = cardColor)
                                      ) {
                                          Row(
                                              modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp),
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.SpaceBetween
                                          ) {
                                              Row(
                                                  modifier = Modifier.weight(1f).clickable {
                                                      openApp("com.google.android.apps.youtube.music")
                                                  },
                                                  verticalAlignment = Alignment.CenterVertically
                                              ) {
                                                  Surface(
                                                      modifier = Modifier.size(46.dp),
                                                      shape = CircleShape,
                                                      color = Color(0xFFFF5252).copy(alpha = 0.2f)
                                                  ) {
                                                      Box(contentAlignment = Alignment.Center) {
                                                          Icon(Icons.Default.MusicNote, contentDescription = null, tint = Color(0xFFFF5252), modifier = Modifier.size(26.dp))
                                                      }
                                                  }
                                                  Spacer(modifier = Modifier.width(12.dp))
                                                  Column {
                                                      Text(trackTitle, color = textColor, fontSize = 16.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                                      Text(trackArtist, color = Color.Gray, fontSize = 13.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                                  }
                                              }

                                              Row(
                                                  verticalAlignment = Alignment.CenterVertically,
                                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                                              ) {
                                                  IconButton(onClick = { sendMediaKey(KeyEvent.KEYCODE_MEDIA_PREVIOUS) }) {
                                                      Icon(Icons.Default.SkipPrevious, contentDescription = "Önceki", tint = textColor, modifier = Modifier.size(34.dp))
                                                  }
                                                  FilledIconButton(
                                                      onClick = {
                                                          sendMediaKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                                                          isPlaying = !isPlaying
                                                      },
                                                      colors = IconButtonDefaults.filledIconButtonColors(containerColor = Color(0xFFFF5252)),
                                                      modifier = Modifier.size(46.dp)
                                                  ) {
                                                      Icon(
                                                          if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                                          contentDescription = "Oynat/Duraklat",
                                                          tint = Color.White,
                                                          modifier = Modifier.size(28.dp)
                                                      )
                                                  }
                                                  IconButton(onClick = { sendMediaKey(KeyEvent.KEYCODE_MEDIA_NEXT) }) {
                                                      Icon(Icons.Default.SkipNext, contentDescription = "Sonraki", tint = textColor, modifier = Modifier.size(34.dp))
                                                  }
                                              }
                                          }
                                      }

                                      // 7. Parlaklık Slider ve Gece/Gündüz Modu (3.1 Oran)
                                      Card(
                                          modifier = Modifier.weight(3.1f).fillMaxHeight(),
                                          shape = RoundedCornerShape(14.dp),
                                          colors = CardDefaults.cardColors(containerColor = cardColor)
                                      ) {
                                          Row(
                                              modifier = Modifier.fillMaxSize().padding(horizontal = 12.dp),
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.spacedBy(8.dp)
                                          ) {
                                              Icon(Icons.Default.BrightnessLow, contentDescription = null, tint = Color.Gray, modifier = Modifier.size(22.dp))
                                              Slider(
                                                  value = brightness,
                                                  onValueChange = {
                                                      brightness = it
                                                      setScreenBrightness(it)
                                                  },
                                                  valueRange = 10f..255f,
                                                  modifier = Modifier.weight(1f),
                                                  colors = SliderDefaults.colors(
                                                      thumbColor = Color(0xFF00E5FF),
                                                      activeTrackColor = Color(0xFF00E5FF)
                                                  )
                                              )
                                              IconButton(onClick = { isDarkTheme = !isDarkTheme }) {
                                                  Icon(
                                                      if (isDarkTheme) Icons.Default.LightMode else Icons.Default.DarkMode,
                                                      contentDescription = "Tema",
                                                      tint = if (isDarkTheme) Color(0xFFFFD54F) else Color(0xFF5C6BC0),
                                                      modifier = Modifier.size(26.dp)
                                                  )
                                              }
                                          }
                                      }
                                  }
                              }
                          }

                          // UYGULAMA ÇEKMECESİ PENCERESİ (APP DRAWER)
                          if (showAppDrawer) {
                              val apps = remember { getInstalledApps() }
                              Dialog(onDismissRequest = { showAppDrawer = false }) {
                                  Card(
                                      modifier = Modifier.fillMaxWidth(0.85f).fillMaxHeight(0.85f),
                                      shape = RoundedCornerShape(16.dp),
                                      colors = CardDefaults.cardColors(containerColor = cardColor)
                                  ) {
                                      Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                                          Row(
                                              modifier = Modifier.fillMaxWidth(),
                                              horizontalArrangement = Arrangement.SpaceBetween,
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Text("Tüm Uygulamalar", color = textColor, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                              IconButton(onClick = { showAppDrawer = false }) {
                                                  Icon(Icons.Default.Close, contentDescription = "Kapat", tint = textColor)
                                              }
                                          }
                                          Spacer(modifier = Modifier.height(12.dp))
                                          LazyVerticalGrid(
                                              columns = GridCells.Fixed(4),
                                              verticalArrangement = Arrangement.spacedBy(10.dp),
                                              horizontalArrangement = Arrangement.spacedBy(10.dp),
                                              modifier = Modifier.fillMaxSize()
                                          ) {
                                              items(apps) { app ->
                                                  Card(
                                                      modifier = Modifier.fillMaxWidth().height(64.dp).clickable {
                                                          showAppDrawer = false
                                                          openApp(app.packageName)
                                                      },
                                                      colors = CardDefaults.cardColors(containerColor = bgColor),
                                                      shape = RoundedCornerShape(10.dp)
                                                  ) {
                                                      Box(modifier = Modifier.fillMaxSize().padding(8.dp), contentAlignment = Alignment.Center) {
                                                          Text(
                                                              text = app.label,
                                                              color = textColor,
                                                              fontSize = 14.sp,
                                                              maxLines = 2,
                                                              overflow = TextOverflow.Ellipsis
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private fun sendMediaKey(keyCode: Int) {
                  val eventTime = SystemClock.uptimeMillis()
                  val downEvent = KeyEvent(eventTime, eventTime, KeyEvent.ACTION_DOWN, keyCode, 0)
                  val upEvent = KeyEvent(eventTime, eventTime, KeyEvent.ACTION_UP, keyCode, 0)
                  audioManager.dispatchMediaKeyEvent(downEvent)
                  audioManager.dispatchMediaKeyEvent(upEvent)
              }

              private fun getScreenBrightness(): Float {
                  return try {
                      Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS).toFloat()
                  } catch (_: Exception) {
                      128f
                  }
              }

              private fun setScreenBrightness(value: Float) {
                  if (Settings.System.canWrite(this)) {
                      Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, value.toInt())
                  } else {
                      val intent = Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS).apply {
                          data = Uri.parse("package:$packageName")
                      }
                      startActivity(intent)
                  }
              }

              private fun getInstalledApps(): List<AppInfo> {
                  val pm = packageManager
                  val intent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  return pm.queryIntentActivities(intent, 0).map {
                      AppInfo(
                          label = it.loadLabel(pm).toString(),
                          packageName = it.activityInfo.packageName
                      )
                  }.distinctBy { it.packageName }.sortedBy { it.label.lowercase() }
              }

              private fun startLocationUpdates() {
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500L, 0.5f, this)
                  } catch (_: SecurityException) {}
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startLocationUpdates()
                  }
              }

              override fun onLocationChanged(location: Location) {
                  currentSpeed = ((location.speed * 3.6f).toInt()).toString()
              }

              private fun openApp(packageName: String) {
                  val launchIntent = packageManager.getLaunchIntentForPackage(packageName)
                  if (launchIntent != null) {
                      startActivity(launchIntent)
                  }
              }

              private fun hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(mediaReceiver) } catch (_: Exception) {}
              }
          }
          EOF

      - name: 4. Gradle 8.5 Indir ve APK Derle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

      - name: 5. Hazir APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: FYT-1600x720-Car-Launcher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
