                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MediaNotificationListener.kt
          package com.fyt.carlauncher

          import android.app.Notification
          import android.content.ComponentName
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.BitmapDrawable
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          object MediaState {
              var title by mutableStateOf("YouTube Music")
              var artist by mutableStateOf("Medya Bekleniyor...")
              var isPlaying by mutableStateOf(false)
              var albumArt by mutableStateOf<Bitmap?>(null)
          }

          object NavState {
              var isNavigating by mutableStateOf(false)
              var instruction by mutableStateOf("Google Maps")
              var distanceEta by mutableStateOf("Navigasyonu Başlatmak İçin Dokunun")
              var navIcon by mutableStateOf<Bitmap?>(null)
          }

          class MediaNotificationListener : NotificationListenerService() {
              private var mediaSessionManager: MediaSessionManager? = null
              private var activeController: MediaController? = null

              private val callback = object : MediaController.Callback() {
                  override fun onMetadataChanged(metadata: MediaMetadata?) {
                      updateMetadata(metadata)
                  }
                  override fun onPlaybackStateChanged(state: PlaybackState?) {
                      MediaState.isPlaying = state?.state == PlaybackState.STATE_PLAYING
                  }
              }

              private val sessionListener = MediaSessionManager.OnActiveSessionsChangedListener { controllers ->
                  attachToController(controllers)
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  try {
                      mediaSessionManager = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val componentName = ComponentName(this, MediaNotificationListener::class.java)
                      mediaSessionManager?.addOnActiveSessionsChangedListener(sessionListener, componentName)
                      attachToController(mediaSessionManager?.getActiveSessions(componentName))
                      checkActiveNotifications()
                  } catch (_: Exception) {}
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  try {
                      val componentName = ComponentName(this, MediaNotificationListener::class.java)
                      attachToController(mediaSessionManager?.getActiveSessions(componentName))
                      if (sbn?.packageName == "com.google.android.apps.maps") {
                          parseMapsNotification(sbn)
                      }
                  } catch (_: Exception) {}
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  super.onNotificationRemoved(sbn)
                  if (sbn?.packageName == "com.google.android.apps.maps") {
                      NavState.isNavigating = false
                      NavState.instruction = "Google Maps"
                      NavState.distanceEta = "Navigasyonu Başlatmak İçin Dokunun"
                      NavState.navIcon = null
                  }
              }

              private fun checkActiveNotifications() {
                  try {
                      val active = activeNotifications ?: return
                      for (sbn in active) {
                          if (sbn.packageName == "com.google.android.apps.maps") {
                              parseMapsNotification(sbn)
                          }
                      }
                  } catch (_: Exception) {}
              }

              private fun parseMapsNotification(sbn: StatusBarNotification) {
                  val extras = sbn.notification.extras ?: return
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val subText = extras.getCharSequence(Notification.EXTRA_SUB_TEXT)?.toString() ?: ""

                  if (title.isNotBlank() || text.isNotBlank()) {
                      NavState.isNavigating = true
                      NavState.instruction = if (title.isNotBlank()) title else text
                      NavState.distanceEta = when {
                          text.isNotBlank() && subText.isNotBlank() -> "$text • $subText"
                          text.isNotBlank() && text != NavState.instruction -> text
                          subText.isNotBlank() -> subText
                          else -> "Rota Aktif"
                      }
                      try {
                          val largeIcon = sbn.notification.getLargeIcon()
                          if (largeIcon != null) {
                              val drawable = largeIcon.loadDrawable(this)
                              if (drawable is BitmapDrawable) {
                                  NavState.navIcon = drawable.bitmap
                              } else if (drawable != null) {
                                  val bmp = Bitmap.createBitmap(
                                      drawable.intrinsicWidth.coerceAtLeast(1),
                                      drawable.intrinsicHeight.coerceAtLeast(1),
                                      Bitmap.Config.ARGB_8888
                                  )
                                  val canvas = Canvas(bmp)
                                  drawable.setBounds(0, 0, canvas.width, canvas.height)
                                  drawable.draw(canvas)
                                  NavState.navIcon = bmp
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun attachToController(controllers: List<MediaController>?) {
                  if (controllers.isNullOrEmpty()) return
                  val controller = controllers.firstOrNull {
                      it.playbackState?.state == PlaybackState.STATE_PLAYING
                  } ?: controllers.first()

                  activeController?.unregisterCallback(callback)
                  activeController = controller
                  controller.registerCallback(callback)
                  updateMetadata(controller.metadata)
                  MediaState.isPlaying = controller.playbackState?.state == PlaybackState.STATE_PLAYING
              }

              private fun updateMetadata(metadata: MediaMetadata?) {
                  if (metadata == null) return
                  val title = metadata.getString(MediaMetadata.METADATA_KEY_TITLE)
                      ?: metadata.getString(MediaMetadata.METADATA_KEY_DISPLAY_TITLE)
                  val artist = metadata.getString(MediaMetadata.METADATA_KEY_ARTIST)
                      ?: metadata.getString(MediaMetadata.METADATA_KEY_ALBUM_ARTIST)
                      ?: metadata.getString(MediaMetadata.METADATA_KEY_AUTHOR)
                  val art = metadata.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                      ?: metadata.getBitmap(MediaMetadata.METADATA_KEY_ART)

                  if (!title.isNullOrBlank()) {
                      MediaState.title = title
                      MediaState.artist = if (!artist.isNullOrBlank()) artist else "YouTube Music"
                      MediaState.albumArt = art
                  }
              }

              override fun onListenerDisconnected() {
                  super.onListenerDisconnected()
                  try {
                      mediaSessionManager?.removeOnActiveSessionsChangedListener(sessionListener)
                      activeController?.unregisterCallback(callback)
                  } catch (_: Exception) {}
              }
          }
          EOF

