name: Build FYT Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Proje Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/fyt/carlauncher app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FYTCarLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.fyt.carlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fyt.carlauncher"
                  minSdk = 28
                  targetSdk = 29
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.google.android.gms:play-services-location:21.1.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <application android:allowBackup="true" android:label="FYT Car Launcher">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/Theme.FYTCarLauncher">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FYTCarLauncher" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MainActivity.kt
          package com.fyt.carlauncher
          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.core.app.ActivityCompat
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity(), LocationListener {
              private lateinit var locationManager: LocationManager
              var currentSpeed by mutableStateOf("0")
              var trackTitle by mutableStateOf("YouTube Music - Bekleniyor...")
              private val mediaReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val artist = intent?.getStringExtra("artist") ?: ""
                      val track = intent?.getStringExtra("track") ?: ""
                      if (track.isNotEmpty()) {
                          trackTitle = if (artist.isNotEmpty()) "$artist - $track" else track
                      }
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  if (ActivityCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1f, this)
                  }
                  val filter = IntentFilter().apply {
                      addAction("com.android.music.metachanged")
                      addAction("com.google.android.apps.youtube.music.METADATA_CHANGED")
                  }
                  registerReceiver(mediaReceiver, filter)
                  setContent {
                      Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF121212)) {
                          Row(modifier = Modifier.fillMaxSize().padding(8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              // 1. Dock (Sol Menü)
                              Card(modifier = Modifier.weight(1.0f).fillMaxHeight(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Dock", color = Color.White, fontSize = 14.sp) }
                              }
                              // Sağ Alanlar
                              Column(modifier = Modifier.weight(9.0f).fillMaxHeight(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  // Üst Satır (Maps, AUX Kamera, Hız / Blitzer)
                                  Row(modifier = Modifier.weight(7.5f).fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      // Maps (Kalan tüm alan)
                                      Card(modifier = Modifier.weight(5.0f).fillMaxHeight(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Google Maps", color = Color.LightGray, fontSize = 16.sp) }
                                      }
                                      // AUX Kamera (Biraz daha ince)
                                      Card(modifier = Modifier.weight(2.4f).fillMaxHeight(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("AUX Kamera", color = Color.LightGray, fontSize = 14.sp) }
                                      }
                                      // Hız ve Blitzer Sütunu
                                      Column(modifier = Modifier.weight(2.1f).fillMaxHeight(), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                          Card(modifier = Modifier.weight(1f).fillMaxWidth(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("$currentSpeed km/h", color = Color.Cyan, fontSize = 18.sp) }
                                          }
                                          Card(modifier = Modifier.weight(1f).fillMaxWidth(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                              Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Blitzer.de", color = Color.Yellow, fontSize = 14.sp) }
                                          }
                                      }
                                  }
                                  // Alt Satır (YouTube Music ve Tema - Yarı Yarıya İnce)
                                  Row(modifier = Modifier.weight(2.5f).fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Card(modifier = Modifier.weight(6.9f).fillMaxHeight(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text(trackTitle, color = Color.LightGray, fontSize = 15.sp) }
                                      }
                                      Card(modifier = Modifier.weight(3.1f).fillMaxHeight(), shape = RoundedCornerShape(12.dp), colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E))) {
                                          Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Text("Tema / Parlaklık", color = Color.LightGray, fontSize = 14.sp) }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
              override fun onLocationChanged(location: Location) {
                  currentSpeed = ((location.speed * 3.6).toInt()).toString()
              }
              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(mediaReceiver) } catch (_: Exception) {}
              }
          }
          EOF

      - name: 4. Gradle 8.5 İndir ve APK Derle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon

      - name: 5. Hazır APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: FYT-1600x720-Car-Launcher-APK
          path: app/build/outputs/apk/debug/*.apk
