name: Build FYT Car Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Depoyu Cek
        uses: actions/checkout@v4

      - name: 2. JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Proje Dosyalarini Olustur
        run: |
          mkdir -p app/src/main/java/com/fyt/carlauncher app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FYTCarLauncher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.fyt.carlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fyt.carlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 14
                  versionName = "2.0.1"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.10" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="FYT Car Launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MediaNotificationListener"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fyt/carlauncher/MediaNotificationListener.kt
          package com.fyt.carlauncher

          import android.app.Notification
          import android.content.ComponentName
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.BitmapDrawable
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          object MediaState {
              var title by mutableStateOf("YouTube Music")
              var artist by mutableStateOf("Medya Bekleniyor...")
              var isPlaying by mutableStateOf(false)
              var albumArt by mutableStateOf<Bitmap?>(null)
          }

          object NavState {
              var isNavigating by mutableStateOf(false)
              var instruction by mutableStateOf("Google Maps")
              var distanceEta by mutableStateOf("Navigasyonu Başlatmak İçin Dokunun")
              var navIcon by mutableStateOf<Bitmap?>(null)
          }

          class MediaNotificationListener : NotificationListenerService() {
              private var mediaSessionManager: MediaSessionManager? = null
              private var activeController: MediaController? = null

              private val callback = object : MediaController.Callback() {
                  override fun onMetadataChanged(metadata: MediaMetadata?) {
                      updateMetadata(metadata)
                  }
                  override fun onPlaybackStateChanged(state: PlaybackState?) {
                      MediaState.isPlaying = state?.state == PlaybackState.STATE_PLAYING
                  }
              }

              private val sessionListener = MediaSessionManager.OnActiveSessionsChangedListener { controllers ->
                  attachToController(controllers)
              }

              override fun onListenerConnected() {
                  super.onListenerConnected()
                  try {
                      mediaSessionManager = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val componentName = ComponentName(this, MediaNotificationListener::class.java)
                      mediaSessionManager?.addOnActiveSessionsChangedListener(sessionListener, componentName)
                      attachToController(mediaSessionManager?.getActiveSessions(componentName))
                      checkActiveNotifications()
                  } catch (_: Exception) {}
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  try {
                      val componentName = ComponentName(this, MediaNotificationListener::class.java)
                      attachToController(mediaSessionManager?.getActiveSessions(componentName))
                      if (sbn?.packageName == "com.google.android.apps.maps") {
                          parseMapsNotification(sbn)
                      }
                  } catch (_: Exception) {}
              }

              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  super.onNotificationRemoved(sbn)
                  if (sbn?.packageName == "com.google.android.apps.maps") {
                      NavState.isNavigating = false
                      NavState.instruction = "Google Maps"
                      NavState.distanceEta = "Navigasyonu Başlatmak İçin Dokunun"
                      NavState.navIcon = null
                  }
              }

              private fun checkActiveNotifications() {
                  try {
                      val active = activeNotifications ?: return
                      for (sbn in active) {
                          if (sbn.packageName == "com.google.android.apps.maps") {
                              parseMapsNotification(sbn)
                          }
                      }
                  } catch (_: Exception) {}
              }

